<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f9fc"/>
      <stop offset="1" stop-color="#eef3f8"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#192b45"/>
      <stop offset="1" stop-color="#254a73"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#18283b" flood-opacity=".13"/>
    </filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2473c8"/>
    </marker>
    <marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#ec7211"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2f8f5b"/>
    </marker>
    <style>
      .sans{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
      .title{font-size:38px;font-weight:750;fill:#16283f}
      .sub{font-size:19px;fill:#526579}
      .regionTitle{font-size:25px;font-weight:750;fill:#16283f}
      .label{font-size:18px;font-weight:700;fill:#172a43}
      .small{font-size:15px;fill:#53667b}
      .tiny{font-size:13px;fill:#5f7183}
      .white{fill:white}
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="70" y="68" class="sans title">Capacity-first regional recovery on EKS</text>
  <text x="70" y="102" class="sans sub">ARC remembers demonstrated capacity, prepares the destination, then changes the Route 53 health state.</text>

  <g filter="url(#shadow)">
    <rect x="210" y="135" width="1180" height="122" rx="22" fill="url(#arc)"/>
  </g>
  <text x="250" y="176" class="sans white" font-size="19" font-weight="700">AWS ARC REGION SWITCH · GLOBAL ORCHESTRATION</text>
  <g class="sans">
    <rect x="250" y="194" width="250" height="42" rx="21" fill="#fff" opacity=".96"/>
    <text x="375" y="221" text-anchor="middle" font-size="16" font-weight="700" fill="#2d425d">1 · Optional policy gate</text>
    <path d="M505 215 H650" stroke="#f7a94b" stroke-width="4" marker-end="url(#arrowOrange)"/>
    <rect x="665" y="194" width="280" height="42" rx="21" fill="#fff" opacity=".96"/>
    <text x="805" y="221" text-anchor="middle" font-size="16" font-weight="700" fill="#2d425d">2 · Pre-scale &amp; wait ready</text>
    <path d="M950 215 H1085" stroke="#f7a94b" stroke-width="4" marker-end="url(#arrowOrange)"/>
    <rect x="1100" y="194" width="250" height="42" rx="21" fill="#fff" opacity=".96"/>
    <text x="1225" y="221" text-anchor="middle" font-size="16" font-weight="700" fill="#2d425d">3 · Switch health state</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="88" y="318" width="610" height="455" rx="24" fill="#fff" stroke="#b9cadb" stroke-width="2"/>
    <rect x="902" y="318" width="610" height="455" rx="24" fill="#fff" stroke="#b9cadb" stroke-width="2"/>
  </g>

  <rect x="88" y="318" width="610" height="72" rx="24" fill="#e9f3ff"/>
  <rect x="88" y="365" width="610" height="25" fill="#e9f3ff"/>
  <circle cx="130" cy="354" r="17" fill="#2473c8"/>
  <text x="160" y="352" class="sans regionTitle">US West (Oregon)</text>
  <text x="160" y="376" class="sans small">Primary before recovery · 100% effective traffic</text>

  <rect x="902" y="318" width="610" height="72" rx="24" fill="#eef9f2"/>
  <rect x="902" y="365" width="610" height="25" fill="#eef9f2"/>
  <circle cx="944" cy="354" r="17" fill="#2f8f5b"/>
  <text x="974" y="352" class="sans regionTitle">US East (Ohio)</text>
  <text x="974" y="376" class="sans small">Destination · one warm pod becomes twenty before traffic</text>

  <g class="sans">
    <rect x="142" y="425" width="165" height="64" rx="15" fill="#f4f8fc" stroke="#9db4ca"/>
    <text x="224" y="452" text-anchor="middle" class="label">Network LB</text>
    <text x="224" y="474" text-anchor="middle" class="tiny">Oregon endpoint</text>
    <rect x="460" y="425" width="165" height="64" rx="15" fill="#f4f8fc" stroke="#9db4ca"/>
    <text x="542" y="452" text-anchor="middle" class="label">EKS service</text>
    <text x="542" y="474" text-anchor="middle" class="tiny">20 ready pods</text>
    <path d="M308 457 H445" stroke="#2473c8" stroke-width="4" marker-end="url(#arrowBlue)"/>

    <rect x="956" y="425" width="165" height="64" rx="15" fill="#f4fbf6" stroke="#91c9a9"/>
    <text x="1038" y="452" text-anchor="middle" class="label">Network LB</text>
    <text x="1038" y="474" text-anchor="middle" class="tiny">Ohio endpoint</text>
    <rect x="1274" y="425" width="165" height="64" rx="15" fill="#f4fbf6" stroke="#91c9a9"/>
    <text x="1356" y="452" text-anchor="middle" class="label">EKS service</text>
    <text x="1356" y="474" text-anchor="middle" class="tiny">1 → 20 ready pods</text>
    <path d="M1122 457 H1259" stroke="#2f8f5b" stroke-width="4" marker-end="url(#arrowGreen)"/>
  </g>

  <g fill="#2473c8">
    <rect x="468" y="520" width="28" height="28" rx="7"/><rect x="504" y="520" width="28" height="28" rx="7"/>
    <rect x="540" y="520" width="28" height="28" rx="7"/><rect x="576" y="520" width="28" height="28" rx="7"/>
    <rect x="468" y="556" width="28" height="28" rx="7"/><rect x="504" y="556" width="28" height="28" rx="7"/>
    <rect x="540" y="556" width="28" height="28" rx="7"/><rect x="576" y="556" width="28" height="28" rx="7"/>
  </g>
  <text x="542" y="611" text-anchor="middle" class="sans tiny">20 replicas observed in the prior 24h</text>

  <g fill="#2f8f5b">
    <rect x="1282" y="520" width="28" height="28" rx="7"/><rect x="1318" y="520" width="28" height="28" rx="7"/>
    <rect x="1354" y="520" width="28" height="28" rx="7"/><rect x="1390" y="520" width="28" height="28" rx="7"/>
    <rect x="1282" y="556" width="28" height="28" rx="7"/><rect x="1318" y="556" width="28" height="28" rx="7"/>
    <rect x="1354" y="556" width="28" height="28" rx="7"/><rect x="1390" y="556" width="28" height="28" rx="7"/>
  </g>
  <text x="1356" y="611" text-anchor="middle" class="sans tiny">ARC waits until destination pods are ready</text>

  <g class="sans">
    <rect x="160" y="650" width="466" height="82" rx="17" fill="#fff8ed" stroke="#f2b36f"/>
    <text x="393" y="680" text-anchor="middle" class="label">DynamoDB replica · Oregon</text>
    <text x="393" y="707" text-anchor="middle" class="small">Global Table data plane remains active/active</text>
    <rect x="974" y="650" width="466" height="82" rx="17" fill="#fff8ed" stroke="#f2b36f"/>
    <text x="1207" y="680" text-anchor="middle" class="label">DynamoDB replica · Ohio</text>
    <text x="1207" y="707" text-anchor="middle" class="small">Application reads and writes the local replica</text>
    <path d="M628 691 H958" stroke="#ec7211" stroke-width="4" stroke-dasharray="11 8" marker-end="url(#arrowOrange)"/>
    <path d="M958 711 H628" stroke="#ec7211" stroke-width="4" stroke-dasharray="11 8" marker-end="url(#arrowOrange)"/>
  </g>

  <g class="sans">
    <circle cx="800" cy="292" r="31" fill="#16283f"/>
    <text x="800" y="289" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">CLIENT</text>
    <text x="800" y="305" text-anchor="middle" fill="#fff" font-size="10">traffic</text>
    <rect x="719" y="350" width="162" height="73" rx="16" fill="#fff" stroke="#8aa7c2" stroke-width="2"/>
    <text x="800" y="380" text-anchor="middle" class="label">Route 53</text>
    <text x="800" y="405" text-anchor="middle" class="tiny">weighted records + ARC health</text>
    <path d="M800 324 V344" stroke="#2473c8" stroke-width="4" marker-end="url(#arrowBlue)"/>
    <path d="M719 390 C610 365 420 390 306 425" fill="none" stroke="#2473c8" stroke-width="4" marker-end="url(#arrowBlue)"/>
    <path d="M881 390 C915 392 940 402 965 424" fill="none" stroke="#2f8f5b" stroke-width="4" marker-end="url(#arrowGreen)"/>
  </g>

  <g class="sans">
    <rect x="1165" y="270" width="300" height="44" rx="12" fill="#fff4e7" stroke="#f0a65a"/>
    <text x="1315" y="298" text-anchor="middle" font-size="15" font-weight="700" fill="#74421d">Observed max = 20 · HPA ceiling = 40</text>
    <path d="M1255 314 C1240 345 1290 370 1340 410" fill="none" stroke="#ec7211" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrowOrange)"/>
    <rect x="140" y="270" width="345" height="44" rx="12" fill="#eef3f8" stroke="#a9bbcc"/>
    <text x="312" y="298" text-anchor="middle" font-size="15" font-weight="700" fill="#3e5369">CloudWatch gate is optional in ungraceful mode</text>
    <path d="M485 292 H615" stroke="#6e8092" stroke-width="3" stroke-dasharray="8 6"/>
  </g>

  <g class="sans">
    <rect x="390" y="807" width="820" height="58" rx="18" fill="#172a43"/>
    <text x="800" y="832" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">Failover invariant</text>
    <text x="800" y="853" text-anchor="middle" fill="#dce8f4" font-size="15">No traffic movement until observed capacity is restored and destination pods are ready.</text>
  </g>
</svg>
