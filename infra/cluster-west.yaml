apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: arc-eks-24h-west
  region: us-west-2
  tags:
    Project: arc-eks-24h-lab
    Environment: experiment
    ManagedBy: eksctl

vpc:
  cidr: 10.72.0.0/16
  clusterEndpoints:
    publicAccess: true
    privateAccess: true
  nat:
    gateway: Disable

iam:
  withOIDC: true

autoModeConfig:
  enabled: true
  nodePools:
    - general-purpose
